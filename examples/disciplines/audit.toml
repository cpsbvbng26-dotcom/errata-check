# 分野ごとの見本。
#
#     python3 errata_check.py examples/disciplines/audit.toml
#
# 一次資料はどちらも合成である。**引用の一致だけが検査ではない**ことを示すために、
# 検定統計量・GRIM・識別子・算術・元号を一通り入れてある。

[document]
path = "record.md"

[[source]]
id = "paper"
path = "paper.pdf"
sha256 = "becf892241128c680e289e7541e303f48b5bc23bb1042317cae31ecea05dcd88"

[[source]]
id = "record"
path = "record.md"
sha256 = "4a5b0d5159a20ed5a0f385e8aa92d405cb9b82954d77e891402bf1fa51b56125"

# ------------------------------------------------- 検定（statcheck と同じ考え方）
#
# 印字された統計量と自由度から p を計算し直し、印字された p と合うかを見る。
# 合わなければ、統計量・自由度・p のどれかが誤っている。

[[statistic]]
source = "paper"
where = "結果 1"
text = "t(28) = 2.14, p = .04"
test = "t"
df = [28]
value = 2.14
reported = "p = .04"

[[statistic]]
source = "paper"
where = "結果 2"
text = "F(3, 20) = 3.10, p = .049"
test = "F"
df = [3, 20]
value = 3.10
reported = "p = .049"
consistent = false          # 正誤表が「ここは誤り」と述べている箇所。
                            # 誤っていることのほうを検査する

[[statistic]]
source = "paper"
where = "結果 3"
text = "chi2(1) = 3.84, p = .05"
test = "chi2"
df = [1]
value = 3.84
reported = "p = .05"

# ------------------------------------------------------- GRIM
#
# 整数を n 人ぶん平均した値は、n をかけると整数にならなければならない。
# 到達できない平均が印字されていれば、平均か人数のどちらかが誤っている。

[[grim]]
source = "paper"
where = "表 1"
text = "Mean score 3.44 (n = 25)"
mean = 3.44
n = 25

[[grim]]
source = "paper"
where = "表 1・対照"
text = "control mean 3.40 (n = 25)"
mean = 3.40
n = 25

# ------------------------------------------------------- 識別子
#
# 検査数字（チェックディジット）が合っているか。一桁でも書き写しを誤れば落ちる。

[[identifier]]
source = "paper"
kind = "orcid"
value = "0009-0000-1406-0547"

[[identifier]]
source = "paper"
kind = "isbn13"
value = "978-0-13-235088-4"

[[identifier]]
source = "paper"
kind = "issn"
value = "0378-5955"

# ------------------------------------------------------- 算術
#
# 臨床試験の流れ図に効く。無作為化された数が、解析と脱落の和に一致するか。

[[arithmetic]]
label = "無作為化 120 = 解析 112 + 脱落 8"
source = "paper"
texts = ["120 participants randomised", "112 were analysed", "8 were lost"]
op = "sum"
values = [112, 8]
equals = 120

# ------------------------------------------------------- 元号
#
# 和暦と西暦の対応。史料を扱うときに効く。

[[era]]
source = "record"
text = "昭和十八年"
gregorian = 1943

[[open_item]]
id = "E1"
heading_pattern = "^## E1 —"
must_say = ["この項目は解決しません"]

[dates]
stamp_pattern = "最終更新: (\\d{4})年(\\d{1,2})月(\\d{1,2})日"
any_pattern = "(\\d{4})年(\\d{1,2})月(\\d{1,2})日"
