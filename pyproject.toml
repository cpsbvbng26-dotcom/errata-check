[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "errata-check"
version = "0.3.0"
description = "Deterministic auditing of correction records against frozen scholarly artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Takuya Nemoto" }]
keywords = [
  "research integrity", "errata", "corrigendum", "post-publication",
  "reproducibility", "continuous integration", "deterministic verification",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

# PDF を一次資料にするときだけ要る。平文（.txt / .md）なら依存は無い。
[project.optional-dependencies]
pdf = ["pypdf>=3"]

[project.urls]
Homepage = "https://github.com/cpsbvbng26-dotcom/errata-check"
Repository = "https://github.com/cpsbvbng26-dotcom/errata-check"
Archive = "https://doi.org/10.5281/zenodo.22685687"

[project.scripts]
errata-check = "errata_check:main"

[tool.setuptools]
py-modules = ["errata_check"]
