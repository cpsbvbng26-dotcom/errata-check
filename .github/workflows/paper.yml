name: 論文の下書き

# JOSS が論文を組むのと同じ道具（openjournals/inara）で、paper.md から PDF の下書きを作る。
# JOSS の論文の手引き（docs/paper.md の「Checking that your paper compiles」）が挙げるやり方の一つで、
# 手引きの GitHub Action（openjournals/openjournals-draft-action）は docker://openjournals/inara:latest を引く。
# latest は動く的なので、アクションを SHA で留めても中身が動く。ここでは同じ像を、版 1.3.1 の digest で留めて直に走らせる。
# digest は Docker Hub の registry が 2026-11-25 に latest と 1.3.1 の両方に返した値である。
on:
  push:
    branches: [main]
    paths: [paper.md, paper.bib, .github/workflows/paper.yml]
  pull_request:
    paths: [paper.md, paper.bib, .github/workflows/paper.yml]
  workflow_dispatch:

# 読むだけで足りる。
permissions:
  contents: read

jobs:
  draft:
    name: JOSS の組版（inara 1.3.1）で PDF の下書きを作る
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 組む
        run: |
          docker run --rm --volume "$PWD:/data" --user "$(id -u):$(id -g)" --env JOURNAL=joss \
            openjournals/inara@sha256:a0414b8b72fd8923917ede614d340d98dc7aa3102aabc2e955e9c02a6100fd62 \
            -o pdf paper.md
          test -s paper.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: paper
          path: paper.pdf
          if-no-files-found: error
